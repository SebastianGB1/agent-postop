<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentos RAG - Larry</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Documentos indexados</h1>
    <p class="subtitle">Base de conocimiento post operatoria (ChromaDB)</p>
  </header>

  <main>
    <section class="upload-panel">
      <form id="upload-form">
        <input type="file" id="file-input" name="files" multiple required />
        <button type="submit">Subir e indexar</button>
      </form>
      <p id="upload-status" class="status"></p>
    </section>

    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="documents">
        Archivos indexados (<span id="doc-count">0</span>)
      </button>
      <button class="tab-btn" data-tab="queue">
        Cola de indexación (<span id="job-count">0</span>)
      </button>
      <button class="tab-btn" data-tab="summaries">
        Resúmenes de llamadas (<span id="summary-count">0</span>)
      </button>
    </nav>

    <section class="tab-panel list-panel" id="tab-documents">
      <div class="list-header">
        <h2>Documentos</h2>
        <button id="refresh-btn" title="Actualizar">Actualizar</button>
      </div>
      <p id="list-status" class="status"></p>
      <table id="doc-table">
        <thead>
          <tr>
            <th>Documento</th>
            <th>Fragmentos</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="doc-table-body"></tbody>
      </table>
    </section>

    <section class="tab-panel queue-panel hidden" id="tab-queue">
      <div class="list-header">
        <h2>Cola de indexación</h2>
      </div>
      <table id="job-table">
        <thead>
          <tr>
            <th>Archivo</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="job-table-body"></tbody>
      </table>
    </section>

    <section class="tab-panel list-panel hidden" id="tab-summaries">
      <div class="list-header">
        <h2>Resúmenes de llamadas</h2>
        <button id="refresh-summaries-btn" title="Actualizar">Actualizar</button>
      </div>
      <p id="summary-status" class="status"></p>
      <table id="summary-table">
        <thead>
          <tr>
            <th>Paciente</th>
            <th>Procedimiento</th>
            <th>Clasificación</th>
            <th>Síntomas / próximos pasos</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="summary-table-body"></tbody>
      </table>
    </section>
  </main>

  <div id="detail-overlay" class="overlay hidden">
    <div class="detail-panel">
      <div class="detail-header">
        <h2 id="detail-title"></h2>
        <button id="close-detail">Cerrar</button>
      </div>
      <div id="detail-chunks"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
