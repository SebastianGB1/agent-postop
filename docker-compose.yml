services:
  # --- Base de datos relacional ---
  postgres:
    image: postgres:16-alpine
    container_name: larry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent-larry
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent-larry"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Vector store para RAG ---
  chromadb:
    image: chromadb/chroma:latest
    container_name: larry-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      # La imagen de chromadb/chroma no trae curl/wget; bash con /dev/tcp
      # si esta disponible y basta para verificar que el puerto responde.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Consola de administracion (sube/lista/elimina documentos del RAG) ---
  api:
    build: .
    container_name: larry-api
    command: >
      sh -c "python -m api.db.seed_dataset &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agent-larry
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # --- Agente de voz (llamada por navegador via WebRTC) ---
  agent:
    build: .
    container_name: larry-agent
    command: ["python", "-m", "agent.agent", "--host", "0.0.0.0"]
    ports:
      - "7860:7860"
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agent-larry
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  chroma_data:
